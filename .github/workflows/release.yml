name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail

          for v in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing required secret: $v"
              exit 1
            fi
          done

          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          [ -n "$APK_IN" ] || { echo "::error::No release APK found"; exit 1; }

          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner
          KEYSTORE="$RUNNER_TEMP/release.keystore"

          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          trap 'rm -f "$KEYSTORE"' EXIT

          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out uta.apk "$APK_IN"

          "$APKSIGNER" verify --print-certs uta.apk

      - name: Generate checksums
        run: sha256sum uta.apk | tee checksums.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uta
          path: |
            uta.apk
            checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          files: |
            uta.apk
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true