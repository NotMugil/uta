name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Determine Version and Tag
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep 'android-versionName' gradle/libs.versions.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')
            if [ -z "$VERSION" ]; then
              echo "::error::Could not determine version. Provide a tag_name input or push a tag."
              exit 1
            fi
            TAG_NAME="v${VERSION}"
            echo "::warning::No tag provided. Derived tag from versionName: $TAG_NAME"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign Release APK
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          TAG="${{ env.TAG_NAME }}"
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release"
            exit 1
          fi

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          OUTPUT_APK="uta-${TAG}.apk"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            "$APKSIGNER" sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass pass:"$STORE_PASSWORD" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$OUTPUT_APK" "$APK_PATH"
            rm -f release.keystore
          else
            if [ -n "$KEYSTORE_BASE64" ] || [ -n "$KEY_ALIAS" ] || [ -n "$STORE_PASSWORD" ] || [ -n "$KEY_PASSWORD" ]; then
              echo "::warning::Some signing secrets are set but not all. Falling back to self-signed key. Required: KEYSTORE_BASE64, KEY_ALIAS, STORE_PASSWORD, KEY_PASSWORD"
            fi
            echo "Generating self-signed release key..."
            keytool -genkey -v -keystore ci-release.keystore -alias ci-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass utapassword -keypass utapassword -dname "CN=uta, OU=Music, O=NotMugil, L=Unknown, ST=Unknown, C=US"
            "$APKSIGNER" sign --ks ci-release.keystore \
              --ks-key-alias ci-key \
              --ks-pass pass:utapassword \
              --key-pass pass:utapassword \
              --out "$OUTPUT_APK" "$APK_PATH"
            rm -f ci-release.keystore
          fi

          echo "APK signed successfully: $OUTPUT_APK"

      - name: Generate Checksums
        run: |
          TAG="${{ env.TAG_NAME }}"
          sha256sum "uta-${TAG}.apk" > checksums.txt
          echo "SHA-256 Checksums:"
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: uta ${{ env.TAG_NAME }}
          files: |
            uta-*.apk
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(env.TAG_NAME, 'alpha') || contains(env.TAG_NAME, 'beta') || contains(env.TAG_NAME, 'rc') || contains(env.TAG_NAME, 'preview') }}
